pre-commit:
  parallel: false
  commands:
    lint:
      priority: 1
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    format:
      priority: 2
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: bunx oxfmt {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun check .
